services:
  # ─── Managed Redis / Key-Value Store ──────────────────────────────────────
  - type: keyvalue
    name: extensionguard-redis
    plan: free
    ipAllowList: []

  # ─── Backend Fastify Security API ─────────────────────────────────────────
  - type: web
    name: extensionguard-api
    env: node
    plan: free
    buildCommand: npm ci && npm run db:generate --workspace=backend && npm run build --workspace=shared && npm run build --workspace=backend
    startCommand: npm run db:deploy && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: extensionguard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: extensionguard-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

  # ─── Frontend React Dashboard ─────────────────────────────────────────────
  - type: web
    name: extensionguard-web
    env: static
    buildCommand: npm ci && npm run build --workspace=shared && npm run build --workspace=frontend
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

# ─── Managed Cloud PostgreSQL ───────────────────────────────────────────────
databases:
  - name: extensionguard-db
    plan: free
